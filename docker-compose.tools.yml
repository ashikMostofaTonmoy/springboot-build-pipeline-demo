# Local SonarQube + Dependency-Track (Docker Desktop)
#   docker compose -f docker-compose.tools.yml up -d
# SonarQube:              http://localhost:9000  (admin / admin, forced change on first login)
# Dependency-Track UI:    http://localhost:8081  (admin / admin, forced change on first login)
# Dependency-Track API:   http://localhost:8082
name: devsecops-tools

services:
  sonarqube:
    image: sonarqube:26.11.0.134175-community
    read_only: true
    tmpfs:
      - /tmp # ES in 26.x writes JVM flag files here
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    ports:
      - "127.0.0.1:9000:9000"
    restart: unless-stopped

  sonar-db:
    image: postgres:17
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - sonar_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  dtrack-api:
    image: ghcr.io/dependencytrack/apiserver:5.0.2
    depends_on:
      dtrack-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3g
    environment:
      DT_DATASOURCE_URL: "jdbc:postgresql://dtrack-db:5432/dtrack"
      DT_DATASOURCE_USERNAME: "dtrack"
      DT_DATASOURCE_PASSWORD: "dtrack"
    volumes:
      - dtrack_data:/data
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped

  dtrack-ui:
    image: ghcr.io/dependencytrack/frontend:5.0.2
    environment:
      API_BASE_URL: "${DTRACK_API_URL:-http://localhost:8082}" # browser calls this directly; set to public API hostname when tunneled
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  dtrack-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dtrack
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: dtrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack -d dtrack"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - dtrack_pg_data:/var/lib/postgresql
    restart: unless-stopped

  # Cloudflare Tunnel. Route targets: http://sonarqube:9000, http://dtrack-ui:8080, http://dtrack-api:8080
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  sonar_pg_data:
  dtrack_data:
  dtrack_pg_data:
